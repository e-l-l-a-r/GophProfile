# Полное окружение для разработки: HTTP-сервер, воркер,
# PostgreSQL, RabbitMQ и MinIO. Запуск: docker compose up -d --build.
name: gophprofile

# Общие настройки сервера и воркера: один образ, подключения к инфраструктуре.
x-app: &app
  build:
    context: .
  image: gophprofile:latest
  environment: &app-env
    LOG_LEVEL: info
    DATABASE_DSN: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
    RABBITMQ_URL: amqp://gophprofile:gophprofile@rabbitmq:5672/
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: gophprofile
    S3_SECRET_KEY: gophprofile
    S3_BUCKET: avatars
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  server:
    <<: *app
    container_name: server
    command: ["server"]
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      ADDRESS: 0.0.0.0:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      CONCURRENCY: "4"
      MAX_RETRIES: "5"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
      POSTGRES_DB: gophprofile
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gophprofile
      RABBITMQ_DEFAULT_PASS: gophprofile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gophprofile
      MINIO_ROOT_PASSWORD: gophprofile
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
