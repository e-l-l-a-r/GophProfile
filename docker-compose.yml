# Полное окружение для разработки: HTTP-сервер, воркер,
# PostgreSQL, RabbitMQ, MinIO и стек наблюдаемости. Запуск: docker compose up -d --build.
name: gophprofile

# Общие настройки сервера и воркера: один образ, подключения к инфраструктуре.
x-app: &app
  build:
    context: .
  image: gophprofile:latest
  environment: &app-env
    LOG_LEVEL: info
    DATABASE_DSN: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
    RABBITMQ_URL: amqp://gophprofile:gophprofile@rabbitmq:5672/
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: gophprofile
    S3_SECRET_KEY: gophprofile
    S3_BUCKET: avatars
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: grpc
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_INSECURE: "true"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
    otel-collector:
      condition: service_started
  restart: unless-stopped

services:
  server:
    <<: *app
    container_name: server
    command: ["server"]
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gophprofile-server
      ADDRESS: 0.0.0.0:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gophprofile-worker
      CONCURRENCY: "4"
      MAX_RETRIES: "5"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
      POSTGRES_DB: gophprofile
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gophprofile
      RABBITMQ_DEFAULT_PASS: gophprofile
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gophprofile
      MINIO_ROOT_PASSWORD: gophprofile
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.143.0
    container_name: otel-collector
    ports:
      - "4317:4317"
      - "8889:8889" # Prometheus exporter metrics
      - "4318:4318" # OTLP http receiver
      - '13133:13133' # health check
    command:
      - "--config=/etc/otel-collector-config.yml"
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:13133' ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped


  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/loki
    environment:
      MINIO_ROOT_USER: gophprofile
      MINIO_ROOT_PASSWORD: gophprofile
    restart: "no"

  loki:
    image: grafana/loki:3.6.3
    container_name: loki
    command:
      - "-config.expand-env=true"
      - "-config.file=/etc/loki/local-config.yml"
    environment:
      MINIO_ROOT_USER: gophprofile
      MINIO_ROOT_PASSWORD: gophprofile
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node_exporter

  jaeger:
    image: jaegertracing/jaeger:2.15.1
    container_name: jaeger
    restart: always
    ports:
      - '16686:16686' # UI Jaeger (http://localhost:16686)

volumes:
  postgres-data:
  minio-data:
  grafana-data:
