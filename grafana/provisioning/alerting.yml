{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "gophprofile",
      "folder": "GophProfile",
      "interval": "1m",
      "rules": [
        {
          "uid": "gp-5xx",
          "title": "Высокая доля 5xx",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"gophprofile-server\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=\"gophprofile-server\"}[5m]))",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Доля ответов 5xx больше 5%"
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "gp-p95",
          "title": "Высокий p95 запросов",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"gophprofile-server\"}[5m])))",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "p95 длительности запроса больше 1 с"
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "gp-queue",
          "title": "Рост очереди",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "max(rabbitmq_queue_depth{queue!~\".*dlq\"})",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        100
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "В очереди больше 100 сообщений"
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "gp-dlq",
          "title": "Сообщения в DLQ",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "sum(rabbitmq_queue_depth{queue=~\".*dlq\"})",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "1m",
          "annotations": {
            "summary": "В очередях недоставленных есть сообщения"
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "gp-upload-errors",
          "title": "Ошибки загрузки аватарок",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "sum(increase(avatars_uploads_total{status=\"error\"}[5m]))",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Более 5 неудачных загрузок за 5 минут"
          },
          "labels": {
            "severity": "warning"
          }
        },
        {
          "uid": "gp-log-errors",
          "title": "Ошибки в логах",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "loki",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "sum(count_over_time({service_name=~\"gophprofile.*\", detected_level=~\"error|ERROR\"}[5m]))",
                "queryType": "instant"
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        10
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Более 10 ошибок в логах за 5 минут"
          },
          "labels": {
            "severity": "warning"
          }
        }
      ]
    }
  ]
}