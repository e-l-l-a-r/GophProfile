{{define "error.html"}}{{template "header" "Error"}}
      <header class="bg-gradient-to-r from-red-600 to-purple-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Error {{.Status}}</h1>
      </header>

      <main class="p-6 space-y-6 text-center">
        <p class="text-white text-lg">{{.Message}}</p>
        {{if .Details}}<p class="text-white/70">{{.Details}}</p>{{end}}
        <a href="/web/upload" class="inline-block text-purple-200 hover:text-white underline">&larr; Back to upload</a>
      </main>
{{template "footer"}}{{end}}
